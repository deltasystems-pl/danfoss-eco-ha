sync_time:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: danfoss_eco

set_vacation:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: danfoss_eco
    temperature:
      required: false
      selector:
        number:
          min: 6
          max: 28
          step: 0.5
          unit_of_measurement: "°C"
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
